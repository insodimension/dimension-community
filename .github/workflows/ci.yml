name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # @fraym/ui is a HOST-RESOLVED external, not a dependency a pack installs:
      # the portable packs (independent-*) build here with vite alone. Packs that
      # still take workspace deps run their tests inside the Dimension monorepo
      # (this repo is mounted there as the marketplace/ submodule). Standalone CI
      # validates what is checkable standalone: the catalog and every pack's layout.
      - run: bun scripts/validate-marketplace.mjs
      # The catalog is a GENERATED index (`scripts/build-index.ts`): every field
      # of every entry — title, icon, version, `requires.dimension`, the
      # `spaces[]` listings — is derived from the pack's own package.json and
      # dimension.plugin.json, so a store can browse this marketplace by
      # fetching ONE file and install only the pack it was asked for. A pack
      # edited without regenerating would leave the shelf advertising a version,
      # a requirement or a screenshot that is not what ships, so CI refuses the
      # drift instead of publishing it.
      - run: bun scripts/build-index.ts --check
      # A changed pack must bump its version: hosts cache installs by version and
      # never re-fetch one they hold (friction #63). A PR compares against its
      # base; a push to main against the commit it replaced.
      - run: bun scripts/check-version-bumps.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
